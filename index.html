    <script>
      // Load Telegram WebApp SDK asynchronously ONLY when running inside Telegram Mini App
      // so filtered telegram.org never blocks or freezes page load in normal browsers.
      (function () {
        try {
          var isTg =
            location.search.indexOf('tgWebApp') > -1 ||
            location.hash.indexOf('tgWebApp') > -1 ||
            /Telegram/i.test(navigator.userAgent || '');
          if (isTg) {
            var s = document.createElement('script');
            s.src = 'https://telegram.org/js/telegram-web-app.js';
            s.async = true;
            document.head.appendChild(s);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
